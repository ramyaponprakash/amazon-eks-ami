# TODO: change qa2. to qa.
nginx:
  default: |
    #load_module modules/ngx_http_headers_more_filter_module.so;

    user nginx;
    worker_processes auto;
    error_log /var/log/nginx/error.log;
    pid /run/nginx.pid;

    # Load dynamic modules. See /usr/share/nginx/README.dynamic.
    include /usr/share/nginx/modules/*.conf;

    events {
        worker_connections 1024;
    }


    http {
        log_format  main  '$remote_addr - $remote_user [$time_local] "$request" "$upstream_response_time" '
                          '$status $body_bytes_sent "$http_referer" '
                          '"$http_user_agent" "$http_x_forwarded_for" '
                          'rt=$request_time uct="$upstream_connect_time" uht="$upstream_header_time" urt="$upstream_response_time"';

        access_log  /var/log/nginx/access.log  main;

        sendfile            on;
        tcp_nopush          on;
        tcp_nodelay         on;
        keepalive_timeout   65;
        types_hash_max_size 2048;
        client_max_body_size 2048;
        client_header_buffer_size 2048;

        gzip              on;
        gzip_http_version 1.0;
        gzip_proxied      any;
        gzip_min_length   500;
        gzip_disable      "MSIE [1-6]\.";
        gzip_types        text/plain text/xml text/css image/svg+xml image/x-icon
                          application/octet-stream
                          application/javascript
                          application/x-javascript
                          application/json
                          text/comma-separated-values;

        include             /etc/nginx/mime.types;
        default_type        application/octet-stream;

        # Load modular configuration files from the /etc/nginx/conf.d directory.
        # See http://nginx.org/en/docs/ngx_core_module.html#include
        # for more information.
        include /etc/nginx/conf.d/*.conf;
        server_tokens off;
        #more_set_headers "Server: ";

        server {
          listen      8081 default_server;
          listen      [::]:8081 default_server;
        }

        server {
          listen     80 default_server;
          listen     [::]:80 default_server;
          server_name _;
          error_page 301 302 /service-moved/index.html;
          location = /service-moved/index.html {
              root /usr/share/nginx/html;
              internal;
          }

          location / {
              return 301 https://qa2.sense-dev.com$request_uri;
          }
        }

        server {
            listen       80;
            listen       [::]:80;
            server_name  qa2.sense-dev.com;
            add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
            root         /usr/share/nginx/html;
            if ($scheme ~ "https") {
                  return 301 https://qa2.sense-dev.com$request_uri;
            }


            # Load configuration files for the default server block.
            include /etc/nginx/default.d/*.conf;

            location ~* .(js|jpg|jpeg|gif|png|css|tgz|gz|rar|bz2|doc|pdf|ppt|tar|wav|bmp|rtf|swf|ico|flv|txt|ttf|woff|woff2|svg)$ {
              expires 1d;
              add_header Pragma public;
              add_header Cache-Control "public";
              access_log off;
            }

            location / {
                # TODO: disable this later
                return 301 https://$host/adex/home;
            }

            error_page 404 /page-not-found/index.html;
            location = /page-not-found/index.html {
                root /usr/share/nginx/html;
                internal;
            }
            error_page 403 /service-unavailable/403.html;
            location = /service-unavailable/403.html {
                root /usr/share/nginx/html;
                internal;
            }
            error_page 400 402 405 /service-unavailable/blank.html;
            location = /service-unavailable/blank.html {
                root /usr/share/nginx/html;
                internal;
            }
            error_page 500 502 503 504 /service-unavailable/index.html;
            location = /service-unavailable/index.html {
                root /usr/share/nginx/html;
                internal;
            }
            error_page 301 302 /service-moved/index.html;
            location = /service-moved/index.html {
                root /usr/share/nginx/html;
                internal;
            }
            add_header X-XSS-Protection "1; mode=block";
            add_header X-Frame-Options SAMEORIGIN;
            add_header X-Content-Type-Options nosniff;
            add_header Content-Security-Policy "style-src 'self' 'unsafe-inline' ; child-src 'self' blob:";
       }
    }


  module: |
    location ~ /sdx/(.*) {
      return 301 https://$host/adex/$1$is_args$args;
    }
    location /adex/ {
      try_files $uri $uri/ /adex/index.html =404;
    }
