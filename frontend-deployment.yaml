apiVersion: apps/v1 # for versions before 1.9.0 use apps/v1beta2
kind: Deployment
metadata:
  name: sdx-frontend-deployment
spec:
  selector:
    matchLabels:
      app: sdx-frontend
  replicas: 2 # tells deployment to run 2 pods matching the template
  template:
    metadata:
      labels:
        app: sdx-frontend
    spec:
      containers:
      - name: sdx-frontend
        image: 342446142760.dkr.ecr.ap-southeast-1.amazonaws.com/sense-frontend:latest
        ports:
        - containerPort: 80