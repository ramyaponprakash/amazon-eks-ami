apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig
metadata:
  name: sdx-dev-eks-test-green-cluster
  region: ap-southeast-1
vpc:
  id: "vpc-09a58d6d"
  securityGroup: sg-0d9d8e6975cff7ace
  autoAllocateIPv6: false
  clusterEndpoints:
    publicAccess: false
    privateAccess: true
  subnets:
    private:
      sdx-dev-subnet-private-1a:
        id: subnet-0459927e5a9a8ba64
      sdx-dev-subnet-private-1b:
        id: subnet-0e1e99fe7c3dbd3f9
#secretsEncryption:
#  keyARN: "arn:aws:kms:us-west-2:000000000000:key/00000000-0000-0000-0000-000000000000"
iam:
  serviceRoleARN: arn:aws:iam::342446142760:role/terraform-eks-sdx-cluster
  withOIDC: true
addons:
  - name: vpc-cni
    attachPolicyARNs:
      - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy
  - name: coredns
    version: latest
  - name: kube-proxy
    version: latest
cloudWatch:
  clusterLogging:
    enableTypes: ["*"]
    logRetentionInDays: 30