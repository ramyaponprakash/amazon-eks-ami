apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
data:
  mapRoles: |
    - groups:
      - system:bootstrappers
      - system:nodes
      rolearn: {{ .Values.awsAuth.boostrap.roleArn }}
      username: system:node:{{"{{"}}EC2PrivateDNSName}}
    - groups:
      - system:masters
      rolearn: {{ .Values.awsAuth.pipeline.roleArn }}
      username: pipeline-bamboo
    - groups:
      - eks-console-dashboard-view-full-access-group
      rolearn: {{ .Values.awsAuth.eksConsoleDashboard.roleArn }}
      username: admin-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: eks-console-dashboard-view-full-access-clusterrole
rules:
  - apiGroups:
      - ""
    resources:
      - nodes
      - namespaces
      - pods
      - events
    verbs:
      - get
      - list
  - apiGroups:
      - apps
    resources:
      - deployments
      - daemonsets
      - statefulsets
      - replicasets
    verbs:
      - get
      - list
  - apiGroups:
      - batch
    resources:
      - jobs
    verbs:
      - get
      - list
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: eks-console-dashboard-view-full-access-binding
subjects:
  - kind: Group
    name: eks-console-dashboard-view-full-access-group
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: ClusterRole
  name: eks-console-dashboard-view-full-access-clusterrole
  apiGroup: rbac.authorization.k8s.io
