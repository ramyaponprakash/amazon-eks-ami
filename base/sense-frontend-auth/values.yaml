env:
component: frontend
namespace: sense

replicas: 1

hostname:
moduleName: sense-frontend-auth

image:
  repository:
  tag: latest
  pullPolicy: IfNotPresent

podAnnotations: {}

podSecurityContext: {}

# NOTE: can consider to make FE's Dockerfile as fully non-privileged or can use non-privileged image
containerSecurityContext:
  readOnlyRootFilesystem: false # mkdir() "/var/cache/nginx/client_temp" failed (30: Read-only file system)
  allowPrivilegeEscalation: false
  privileged: false
  runAsNonRoot: true
  runAsUser: 101 # nginx
  capabilities:
    drop:
      - ALL
    add:
      - CHOWN
      - NET_BIND_SERVICE

resources:
  requests:
    memory: "64Mi"
    cpu: "0.1"
  limits:
    memory: "256Mi"
    cpu: "0.2"

autoscaling:
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

healthcheck:
  enabled:
  port:
  livenessProbe: {}
  readinessProbe: {}

nodeSelector: {}
tolerations: []
affinity: {}

mounts: []
volumes: []

serviceAccount:
  name: sense-frontend-auth

ingressClassName:

deployments:
  frontend-auth:
    imageName: sense-frontend-auth
    imageTag:
    publicPort: 8080
    publicTargetPort: 80
    env: []
    volumes: []
    mounts: []
    nodeSelector: {}
    tolerations: []
    affinity: {}
    autoscaling: {}
    resources: {}