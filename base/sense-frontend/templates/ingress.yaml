apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: sense-frontend-proxy
  namespace: {{ .Values.namespace | default "sense" }}
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  labels:
  {{- include "common.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingressClassName }}
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: frontend-portal
                port:
                  number: 8080
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: frontend-auth
                port:
                  number: 8080