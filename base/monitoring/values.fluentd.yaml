kind: DaemonSet

image:
  repository:
  pullPolicy: IfNotPresent
  tag:

service:
  ports:
   - name: "forwarder"
     protocol: TCP
     containerPort: 24224

env: []

resources:
    limits:
      memory: 200Mi
      cpu: "0.1"

metrics:
  serviceMonitor:
    enabled: false

dashboards:
  enabled: false

volumes:
  - name: varlog
    hostPath:
      path: /var/log
  - name: varlibdockercontainers
    hostPath:
      path: /var/lib/docker/containers

volumeMounts:
  - name: varlog
    mountPath: /var/log
  - name: varlibdockercontainers
    mountPath: /var/lib/docker/containers
    readOnly: true

configMapConfigs: []
fileConfigs: {}