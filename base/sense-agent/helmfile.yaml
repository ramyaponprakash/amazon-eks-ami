helmBinary: {{ requiredEnv "HELM_BINARY" }}

environments:
  dev:
    values:
      - ./values.yaml
      - ../../dev/global.yaml.gotmpl
      - ../../dev/sense-agent/values.yaml

repositories:
  - name: sense-agent
    url: s3://sdx-eks-artifacts/charts/sense-agent

missingFileHandler: Error

releases:
  - name: sense-agent
    namespace: sense
    createNamespace: true
    chart: sense-agent/sense-agent
    version: {{ .Values.chartVer | quote }}
    missingFileHandler: Warn
    values:
      - ./values.yaml
      - ./values.yaml.gotmpl
      - ../../{{ .Environment.Name }}/sense-agent/values.yaml
      - ../../{{ .Environment.Name }}/sense-agent/values.yaml.gotmpl