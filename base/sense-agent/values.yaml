component: agent

enabled: true

hostname:
  internal:
  external:

replicas: 1

image:
  repository:
  tag: latest
  pullPolicy: IfNotPresent

podAnnotations: {}

podSecurityContext: {}

containerSecurityContext: {}
#  readOnlyRootFilesystem: true
#  allowPrivilegeEscalation: false
#  privileged: false
#  runAsNonRoot: true
#  runAsUser: 10001 # appuser
#  capabilities:
#    drop:
#      - ALL

resources:
  requests:
    memory: "64Mi"
    cpu: "0.1"
  limits:
    memory: "256Mi"
    cpu: "0.2"

internal:
  ingressClassName: internal-nlb-default
external:
  ingressClassName: external-alb-default

autoscaling:
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

healthcheck:
  enabled: false
  port: 7171
  livenessProbe:
    httpGet:
      path: /diagnostics/healthcheck
      port: healthcheck
    failureThreshold: 3
    periodSeconds: 30
  readinessProbe:
    httpGet:
      path: /diagnostics/healthcheck
      port: healthcheck
    failureThreshold: 3
    periodSeconds: 30

nodeSelector: {}
tolerations: []
affinity: {}

# base configuration will be applied to all env
base:
  envs: []
  volumes:
    - name: default-config
      configMap:
        name: default-config
  mounts:
    - name: default-config
      readOnly: true
      mountPath: /etc/sense/conf/default.config.yaml
      subPath: default.config.yaml

commons:
  ports: []
  envs: []
  mounts: []
  volumes: []

serviceAccount:
  name: sense-agent

secrets:
  commons: []
  services: []


certs: []

deployments:
  agent-sniff:
    enabled:
    imageName: sense_sniff_agent
    imageTag:
    ports: []
    nodeSelector: {}
    tolerations: []
    affinity: {}
    autoscaling: {}
    resources: {}
    env: []
    volumes: []
    mounts: []
  agent-dbtopics:
    enabled:
    imageName: sense_sniff_agent_dbtopics
    imageTag:
    ports: []
    nodeSelector: {}
    tolerations: []
    affinity: {}
    autoscaling: {}
    resources: {}
    env: []
    volumes: []
    mounts: []
  agent-elastic:
    enabled:
    imageName: sense_sniff_agent_elastic
    imageTag:
    ports: []
    nodeSelector: {}
    tolerations: []
    affinity: {}
    autoscaling: {}
    resources: {}
    env: []
    volumes: []
    mounts: []
