apiVersion: v1
kind: ConfigMap
metadata:
  name: aws-auth
  namespace: kube-system
data:
  mapRoles: |
    - groups:
      - system:bootstrappers
      - system:nodes
      rolearn: arn:aws:iam::342446142760:role/terraform-eks-sdx-node
      username: system:node:{{EC2PrivateDNSName}}
    - groups:
      - system:masters
      rolearn: arn:aws:iam::342446142760:role/forBamboo
      username: pipeline-bamboo
    - groups:
      - system:masters
      rolearn: arn:aws:iam::342446142760:role/gts.gitlab-dedicated
      username: pipeline-gitlab
    - groups:
      - eks-console-dashboard-view-full-access-group
      rolearn: arn:aws:iam::342446142760:role/admin-role
      username: admin-role