helmBinary: {{ requiredEnv "HELM_BINARY" }}

environments:
  dev:
    values:
      - ./values.yaml
      - ../../dev/global.yaml.gotmpl
      - ../../dev/sense-frontend-auth/values.yaml
  qa:
    values:
      - ./values.yaml
      - ../../qa/global.yaml.gotmpl
      - ../../qa/sense-frontend-auth/values.yaml

repositories:
  - name: sense-frontend-auth
    url: s3://sdx-eks-artifacts/charts/sense-frontend-auth

missingFileHandler: Error

releases:
  - name: sense-frontend-auth
    namespace: sense
    createNamespace: true
    chart: sense-frontend-auth/sense-frontend-auth
    version: {{ .Values.chartVer | quote }}
    missingFileHandler: Warn
    values:
      - ./values.yaml
      - ./values.yaml.gotmpl
      - ../../{{ .Environment.Name }}/sense-frontend-auth/values.yaml
      - ../../{{ .Environment.Name }}/sense-frontend-auth/values.yaml.gotmpl
      - ../../{{ .Environment.Name }}/sense-frontend-auth/nginx.config.yaml
