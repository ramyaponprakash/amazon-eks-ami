kind: Ingress
apiVersion: networking.k8s.io/v1
metadata:
  name: opensearch-dashboard
  namespace: {{ .Values.namespace | default "monitoring" }}
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/ssl-redirect: 'false'
    nginx.ingress.kubernetes.io/rewrite-target: /$1
  labels:
  {{- include "common.labels" . | nindent 4 }}
spec:
  ingressClassName: {{ .Values.opensearch.ingressClassName }}
  rules:
    - host: {{ .Values.opensearch.hostname }}
      http:
        paths:
          - path: /(_dashboards/?.*)$
            pathType: Prefix
            backend:
              service:
                name: opensearch-dashboard
                port:
                  number: 443
          {{- if .Values.opensearch.openToLocal }}
          # opens this for local development with dev ES
          - path: /?(.*)$
            pathType: Prefix
            backend:
              service:
                name: opensearch-dashboard
                port:
                  number: 443
          {{- end }}
---
kind: Service
apiVersion: v1
metadata:
  name: opensearch-dashboard
  namespace: {{ .Values.namespace | default "monitoring" }}
  labels:
  {{- include "common.labels" . | nindent 4 }}
spec:
  type: ExternalName
  externalName: {{ .Values.opensearch.vpcEndpoint }}
