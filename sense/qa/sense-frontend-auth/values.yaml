env: qa
namespace: sense
chartVer: 0.0.6

hostname: qa2.sense-dev.com
#hostname: qa.sense-dev.com

image:
  repository: 342446142760.dkr.ecr.ap-southeast-1.amazonaws.com

autoscaling:
  minReplicas: 1
  maxReplicas: 1
  targetCPUUtilizationPercentage: 80
  targetMemoryUtilizationPercentage: 80

ingressClassName: external-alb-default

commons:
  envs:
    - name: MODULE
      value: "auth"
  volumes:
    - name: frontend-nginx-config
      configMap:
        name: frontend-nginx-config
    - name: auth-nginx-config
      configMap:
        name: auth-nginx-config
  mounts:
    - name: frontend-nginx-config
      readOnly: true
      mountPath: /etc/nginx/nginx.conf
      subPath: nginx.conf
    - name: auth-nginx-config
      readOnly: true
      mountPath: /etc/nginx/default.d/nginx-auth.conf
      subPath: nginx-auth.conf

deployments:
  frontend-auth:
    env: []
    volumes: []
    mounts: []
