            pathType: Prefix
          - backend:
              service:
                name: client
                port:
                  number: 8085
            path: /api/(clients/?(.*)$)
            pathType: Prefix
          - backend:
              service:
                name: activity
                port:
                  number: 8087
            path: /api/(activities/?(.*)$)
            pathType: Prefix
          - backend:
              service:
