apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  annotations:
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/proxy-ssl-secret: sense/proxy-ca-secret
    nginx.ingress.kubernetes.io/rewrite-target: /$1
    nginx.ingress.kubernetes.io/secure-backends: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
  labels:
    app.kubernetes.io/managed-by: Helm
  name: sense-backend-proxy
  namespace: sense
spec:
  ingressClassName: nginx-external
  rules:
    - http:
        paths:
          - backend:
              service:
                name: auth
                port:
                  number: 8080
            path: /api/(auth/?(.*)$)
            pathType: Prefix
          - backend:
              service:
                name: iam
                port:
                  number: 8081
            path: /api/(iam/?(.*)$)
            pathType: Prefix
          - backend:
              service:
                name: topics
                port:
                  number: 8082
            path: /api/(topics/?(.*)$)
            pathType: Prefix
          - backend:
              service:
                name: policy
                port:
                  number: 8083
            path: /api/(policies/?(.*)$)
            pathType: Prefix
          - backend:
              service:
                name: role
                port:
                  number: 8084
            path: /api/(role/?(.*)$)
            pathType: Prefix
          - backend:
              service:
                name: client
                port:
                  number: 8085
            path: /api/(clients/?(.*)$)
            pathType: Prefix
          - backend:
              service:
                name: activity
                port:
                  number: 8087
            path: /api/(activities/?(.*)$)
            pathType: Prefix
          - backend:
              service:
                name: subscription
                port:
                  number: 8088
            path: /api/(subscriptions/?(.*)$)
            pathType: Prefix
          - backend:
              service:
                name: onpremtopic
                port:
                  number: 8089
            path: /api/(onpremtopics/?(.*)$)
            pathType: Prefix
          - backend:
              service:
                name: lookup
                port:
                  number: 8999
            path: /api/(lookup/?(.*)$)
            pathType: Prefix
          - backend:
              service:
                name: message
                port:
                  number: 8100
            path: /api/(messages/?(.*)$)
            pathType: Prefix
          - backend:
              service:
                name: notification
                port:
                  number: 8101
            path: /api/(notification/?(.*)$)
            pathType: Prefix
          - backend:
              service:
                name: adaptor
                port:
                  number: 8180
            path: /api/(adaptors/?(.*)$)
            pathType: Prefix
          - backend:
              service:
                name: appsettings
                port:
                  number: 8182
            path: /api/(appsettings/?(.*)$)
            pathType: Prefix
---
