include:
- project: "WOG/GVT/ADEX/ADEX/sense-eks-deployment"
  ref: "develop"
  file:
  - cicd/templates/.common.yml
- cicd/templates/.common.yml
- cicd/templates/.helmfile.yml
- cicd/templates/.terraform.yml


stages:
- validate
- copy
- plan
- apply


workflow:
  rules:
  - if: '$ENV == "dev"'
    variables:
      INSTANCE_ID: "$SOL_DEV_BASTION_ID"
  - if: '$ENV == "qa"'
    variables:
      INSTANCE_ID: "$SOL_QA_BASTION_ID"
  - if: '$ENV == "prod"'
    variables:
      INSTANCE_ID: "$SOL_PROD_BASTION_ID"
  - if: '$ENV == "intra"'
    variables:
      INSTANCE_ID: "$SOL_INTRA_BASTION_ID"
  - when: never


variables:
  TF_ROOT: environments/sol-$ENV


# Define common tasks as a separate block with the correct alias
.common_tasks: &common_tasks
  script:
    - echo "SCP build artifacts into Bridge"
    - echo "****Folder***"
    - export EC2_USER=ec2-user
    - export SCP_SOURCE_FOLDER=$CI_PROJECT_DIR
    - export SOURCE=$CI_PROJECT_DIR.zip
    - export DEST=/tmp/solace
    - !reference [.ssm-clean-scp, script]
    - export SSH_CMD="cd $DEST; unzip $DEST/sense-eks-deployment.zip; cd $DEST/$SCP_SOURCE_FOLDER/environments/sol-$ENV/; terraform init; terraform plan -target=$MODULE; rm -rf $DEST"
    - !reference [ .ssm-ssh-sh, script ]


# Define job for sol-eks-module
sol-eks-module:copy-and-plan:
  stage: plan
  environment: $ENV
  extends: .awscli-root-builder
  when: manual
  script:
    - export MODULE=module.eks
  <<: *common_tasks  # Include common tasks defined above using the alias

# Define job for sol-eks-solace-module
sol-eks-solace-module:copy-and-plan:
  stage: plan
  environment: $ENV
  extends: .awscli-root-builder
  when: manual
  script:
    - export MODULE=module.eks-solace
  <<: *common_tasks  # Include common tasks defined above using the alias


sol-bastion-module:plan:
  stage: plan
  extends: .terraform:plan
  environment: $ENV
  script:
    - export OPTIONS="-target=module.bastion"
    - !reference [.terraform:plan, script]
    

sol-squid-module:plan:
  stage: plan
  extends: .terraform:plan
  environment: $ENV
  script:
    - export OPTIONS="-target=module.squid"
    - !reference [.terraform:plan, script]


sol-eks-module:apply:
  stage: apply
  extends: .terraform:apply
  needs:
    - sol-eks-module:copy-and-plan
  environment: $ENV
  script:
    - export OPTIONS="--auto-approve plan"
  #  - export OPTIONS="-target=module.eks-solace --auto-approve"
    - !reference [.terraform:apply, script]


sol-eks-solace-module:apply:
  stage: apply
  extends: .terraform:apply
  needs:
    - sol-eks-solace-module:copy-and-plan
  environment: $ENV
  script:
    - export OPTIONS="--auto-approve plan"
  #  - export OPTIONS="-target=module.eks-solace --auto-approve"
    - !reference [.terraform:apply, script]


sol-bastion-module:apply:
  stage: apply
  extends: .terraform:apply
  needs:
    - sol-bastion-module:plan
  environment: $ENV
  script:
    - export OPTIONS="--auto-approve plan"
    - !reference [.terraform:apply, script]


sol-squid-module:apply:
  stage: apply
  extends: .terraform:apply
  needs:
    - sol-squid-module:plan
  environment: $ENV
  script:
    - export OPTIONS="--auto-approve plan"
    - !reference [.terraform:apply, script]