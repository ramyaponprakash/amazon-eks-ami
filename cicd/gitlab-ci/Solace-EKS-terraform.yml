include:
- project: "WOG/GVT/ADEX/ADEX/sense-eks-deployment"
  ref: "develop"
  file:
  - cicd/templates/.common.yml
- cicd/templates/.common.yml
- cicd/templates/.helmfile.yml
- cicd/templates/.terraform.yml


stages:
- validate
- copy
- plan
- apply


workflow:
  rules:
  - if: '$ENV == "dev"'
    variables:
      INSTANCE_ID: "$SOL_DEV_BASTION_ID"
  - if: '$ENV == "qa"'
    variables:
      INSTANCE_ID: "$SOL_QA_BASTION_ID"
  - if: '$ENV == "prod"'
    variables:
      INSTANCE_ID: "$SOL_PROD_BASTION_ID"
  - if: '$ENV == "intra"'
    variables:
      INSTANCE_ID: "$SOL_INTRA_BASTION_ID"
  - when: never


variables:
  TF_ROOT: environments/sol-$ENV


# Define job for eks-module in solace
sol-eks-module:copy-and-plan:
  stage: plan
  environment: $ENV
  extends: .awscli-root-builder
  when: manual
  script:
    - export MODULE=module.eks
    - !reference [.terraform:copy-plan, script]
    - echo " 'copy and plan' task of eks module in sol-$ENV environment is completed"

# Define job for eks-solace-module in solace
sol-eks-solace-module:copy-and-plan:
  stage: plan
  environment: $ENV
  extends: .awscli-root-builder
  when: manual
  script:
    - export MODULE=module.eks-solace
    - !reference [.terraform:copy-plan, script]
    - echo " 'copy and plan' task of eks-solace module in sol-$ENV environment is completed"


# Define job for bastion-module in solace
sol-bastion-module:plan:
  stage: plan
  extends: .terraform:plan
  environment: $ENV
  script:
    - export OPTIONS="-target=module.bastion"
    - !reference [.terraform:plan, script]
    - echo " 'plan' task of bastion module in sol-$ENV environment is completed"
    

# Define job for squid-module in solace
sol-squid-module:plan:
  stage: plan
  extends: .terraform:plan
  environment: $ENV
  script:
    - export OPTIONS="-target=module.squid"
    - !reference [.terraform:plan, script]
    - echo " 'plan' task of squid module in sol-$ENV environment is completed"


sol-eks-module:apply:
  stage: apply
  extends: .terraform:apply
  needs:
    - sol-eks-module:copy-and-plan
  environment: $ENV
  script:
    - export OPTIONS="--auto-approve plannnn"
  #  - export OPTIONS="-target=module.eks-solace --auto-approve"
    - !reference [.terraform:apply, script]
    - echo " 'apply' task of eks module in sol-$ENV environment is completed"


sol-eks-solace-module:apply:
  stage: apply
  extends: .terraform:apply
  needs:
    - sol-eks-solace-module:copy-and-plan
  environment: $ENV
  script:
    - export OPTIONS="--auto-approve plannnn"
  #  - export OPTIONS="-target=module.eks-solace --auto-approve"
    - !reference [.terraform:apply, script]
    - echo " 'apply' task of eks-solace module in sol-$ENV environment is completed"


sol-bastion-module:apply:
  stage: apply
  extends: .terraform:apply
  needs:
    - sol-bastion-module:plan
  environment: $ENV
  script:
    - export OPTIONS="--auto-approve plannnn"
    - !reference [.terraform:apply, script]
    - echo " 'apply' task of bastion module in sol-$ENV environment is completed"


sol-squid-module:apply:
  stage: apply
  extends: .terraform:apply
  needs:
    - sol-squid-module:plan
  environment: $ENV
  script:
    - export OPTIONS="--auto-approve plannnn"
    - !reference [.terraform:apply, script]
    - echo " 'apply' task of squid module in sol-$ENV environment is completed"