include:
  - cicd/templates/.common.yml
  - cicd/templates/.helmfile.yml
  - cicd/templates/.terraform.yml


stages:
  - copy
  - validate
  - plan
  - apply


workflow:
  rules:
    - if: '$ENV == "dev/app/chart"'
    - when: never


variables:
  TF_ROOT:


sol-eks:copy-all:
  stage: copy
  extends: .helm-builder
  environment: $ENV
  script:
    - |
      export INSTANCE_ID=$DEPLOYMENT_INSTANCE_ID
      export SCP_SOURCE_FOLDER=.
      export SOURCE=$SCP_SOURCE_FOLDER/repo.zip
      export EC2_USER=ubuntu
      export DEST=/home/$EC2_USER/tmp/tf-$CI_COMMIT_REF_SLUG
    - !reference [.ssm-clean-scp, script]

