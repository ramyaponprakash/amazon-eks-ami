include:
- project: "WOG/GVT/ADEX/ADEX/sense-eks-deployment"
  ref: "develop"
  file:
  - cicd/templates/.common.yml
- cicd/templates/.common.yml
- cicd/templates/.helmfile.yml
- cicd/templates/.terraform.yml


stages:
#- copy
- validate
- copy
- plan
- apply


workflow:
  rules:
  - if: '$ENV == "dev"'
  - if: '$ENV == "qa"'
  - if: '$ENV == "prod"'
  - if: '$ENV == "intra"'
  - when: never


variables:
  TF_ROOT: environments/sol-$ENV


solace-eks-terraform:copy-artifacts-to-bastion:
  stage: copy
  environment: $ENV
  extends: .awscli-root-builder
  script:
  - |
    echo "SCP build artifacts into Bridge"
    echo "****Folder***"
    echo $CI_PROJECT_DIR
    export EC2_USER=ec2-user
    export DEST=/tmp/solace
    export SCP_SOURCE_FOLDER=$CI_PROJECT_DIR
    echo "Source folder is $SCP_SOURCE_FOLDER"
    export SOURCE=$CI_PROJECT_DIR.zip
    echo "Source file is $SOURCE"
    export INSTANCE_ID=$SOL_QA_BASTION_ID
  - !reference [.ssm-clean-scp, script]
  #- export SSH_CMD="unzip $DEST/$SOURCE; cd $DEST/$SCP_SOURCE_FOLDER/environments/sol-$ENV/; terraform init -target=module.eks"
  - export SSH_CMD="cd /tmp/solace; unzip /tmp/solace/sense-eks-deployment.zip; cd /tmp/solace/builds/wog/gvt/adex/adex/sense-eks-deployment/environments/sol-qa; terraform init; terraform plan -target=module.eks"
  - !reference [ .ssm-ssh-sh, script ]

