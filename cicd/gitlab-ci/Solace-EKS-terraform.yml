include:
- project: "WOG/GVT/ADEX/ADEX/sense-eks-deployment"
  ref: "develop"
  file:
  - cicd/templates/.common.yml
- cicd/templates/.common.yml
- cicd/templates/.helmfile.yml
- cicd/templates/.terraform.yml


stages:
- validate
- copy
- plan
- apply


workflow:
  rules:
  - if: '$ENV == "dev"'
  - if: '$ENV == "qa"'
  - if: '$ENV == "prod"'
  - if: '$ENV == "intra"'
  - when: never


variables:
  TF_ROOT: environments/sol-$ENV


sol-eks-module:copy-and-plan:
  stage: plan
  environment: $ENV
  extends: .awscli-root-builder
  when: manual
  script:
  - |
    echo "SCP build artifacts into Bridge"
    echo "****Folder***"
    echo $CI_PROJECT_DIR
    export EC2_USER=ec2-user
    export DEST=/tmp/solace
    export SCP_SOURCE_FOLDER=$CI_PROJECT_DIR
    echo "Source folder is $SCP_SOURCE_FOLDER"
    export SOURCE=$CI_PROJECT_DIR.zip
    echo "Source file is $SOURCE"
    export INSTANCE_ID=$SOL_QA_BASTION_ID
    export MODULE=module.eks
  - !reference [.ssm-clean-scp, script]
  - export SSH_CMD="cd $DEST; unzip $DEST/sense-eks-deployment.zip; cd $DEST/$SCP_SOURCE_FOLDER/environments/sol-$ENV/; terraform init; terraform plan -target=$MODULE; rm -rf /tmp/solace"
  #- export SSH_CMD="cd /tmp/solace; unzip /tmp/solace/sense-eks-deployment.zip; cd /tmp/solace/builds/wog/gvt/adex/adex/sense-eks-deployment/environments/sol-$ENV; terraform init; terraform plan -target=module.eks"
  - !reference [ .ssm-ssh-sh, script ]


sol-eks-solace-module:copy-and-plan:
  stage: plan
  environment: $ENV
  extends: .awscli-root-builder
  when: manual
  script:
  - |
    echo "SCP build artifacts into Bridge"
    echo "****Folder***"
    echo $CI_PROJECT_DIR
    export EC2_USER=ec2-user
    export DEST=/tmp/solace1
    export SCP_SOURCE_FOLDER=$CI_PROJECT_DIR
    echo "Source folder is $SCP_SOURCE_FOLDER"
    export SOURCE=$CI_PROJECT_DIR.zip
    echo "Source file is $SOURCE"
    export INSTANCE_ID=$SOL_QA_BASTION_ID
    export MODULE=module.eks-solace
  - !reference [.ssm-clean-scp, script]
  - export SSH_CMD="cd $DEST; unzip $DEST/sense-eks-deployment.zip; cd $DEST/$SCP_SOURCE_FOLDER/environments/sol-$ENV/; terraform init; terraform plan -target=$MODULE; rm -rf /tmp/solace1"
  #- export SSH_CMD="cd /tmp/solace; unzip /tmp/solace/sense-eks-deployment.zip; cd /tmp/solace/builds/wog/gvt/adex/adex/sense-eks-deployment/environments/sol-$ENV; terraform init; terraform plan -target=module.eks"
  - !reference [ .ssm-ssh-sh, script ]


sol-bastion-module:plan:
  stage: plan
  extends: .terraform:plan
#  needs:
#    - app-eks-terraform:validate
  environment: $ENV
  script:
    - export OPTIONS="-target=module.bastion"
    - !reference [.terraform:plan, script]
    

sol-squid-module:plan:
  stage: plan
  extends: .terraform:plan
#  needs:
#    - app-eks-terraform:validate
  environment: $ENV
  script:
    - export OPTIONS="-target=module.squid"
    - !reference [.terraform:plan, script]


sol-eks-module:apply:
  stage: apply
  extends: .terraform:apply
  needs:
    - sol-eks-module:copy-and-plan
  environment: $ENV
  script:
    - export OPTIONS="--auto-approve plan"
  #  - export OPTIONS="-target=module.eks-solace --auto-approve"
    - !reference [.terraform:apply, script]


sol-eks-solace-module:apply:
  stage: apply
  extends: .terraform:apply
  needs:
    - sol-eks-solace-module:copy-and-plan
  environment: $ENV
  script:
    - export OPTIONS="--auto-approve plan"
  #  - export OPTIONS="-target=module.eks-solace --auto-approve"
    - !reference [.terraform:apply, script]


sol-bastion-module:apply:
  stage: apply
  extends: .terraform:apply
  needs:
    - sol-bastion-module:plan
  environment: $ENV
  script:
    - export OPTIONS="--auto-approve plan"
    - !reference [.terraform:apply, script]


sol-squid-module:apply:
  stage: apply
  extends: .terraform:apply
  needs:
    - sol-squid-module:plan
  environment: $ENV
  script:
    - export OPTIONS="--auto-approve plan"
    - !reference [.terraform:apply, script]