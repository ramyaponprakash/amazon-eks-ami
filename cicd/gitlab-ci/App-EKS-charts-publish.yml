include:
  - cicd/templates/.common.yml
  - cicd/templates/.helmfile.yml

stages:
  - publish

variables:
  K8_VERSION: $K8_VERSION

.gds-account-setup: &gds-account-setup
  variables: {}

.gcc-account-setup: &gcc-account-setup
  variables: {}

workflow:
  rules:
    #    - if: '$ENV == "ami/eks/gds"'
    #      <<: *gds-account-setup
    #    - if: '$ENV == "ami/eks/gcc"'
    #      <<: *gcc-account-setup
    - when: always


app-eks-chart:common:
