include:
  - cicd/templates/.common.yml

variables:
  TF_ROOT: $TF_ROOT

stages:
  - validate
  - plan
  - apply


cache:
  key: terraform-$CI_COMMIT_REF_SLUG
  paths:
    - $TF_ROOT/.terraform


.terraform-builder:
  extends: .awscli-root-builder


.terraform:validate:
  stage: validate
  extends: .terraform-builder
  script:
    - echo "Running terraform fmt (workdir=$TF_ROOT)"
    - rm -rf ${TF_ROOT}/.terraform
    - terraform -chdir=$TF_ROOT fmt
    - echo "Running terraform validate (workdir=$TF_ROOT)"
    - terraform -chdir=$TF_ROOT init
    - terraform -chdir=$TF_ROOT validate


.terraform-script:select-workspace:
  script:
    - export WORKSPACE=$(echo "$ENV" | cut -d'/' -f1)
    - if [ -z "$WORKSPACE" ]; then echo "variable WORKSPACE must be set."; fi
    - echo "Selecting workspace (workspace=$WORKSPACE)"
    - terraform -chdir=$TF_ROOT init
    - |
      terraform -chdir=$TF_ROOT workspace list
      if terraform -chdir=$TF_ROOT workspace list | grep "$WORKSPACE"; then
        echo "Workspace $WORKSPACE already exists. skip"
      else
        echo "Creating Workspace $WORKSPACE."
        terraform -chdir=$TF_ROOT workspace new $WORKSPACE
      fi
    - terraform -chdir=$TF_ROOT workspace select $WORKSPACE


.terraform:plan:
  stage: plan
  extends: .terraform-builder
  artifacts:
    public: false
    paths:
      - tmp/plan
      - tmp/plan.json
    reports:
      terraform: tmp/plan.json
  script:
    - echo "Running terraform plan (workdir=$TF_ROOT, option=$OPTIONS)"
    - terraform -chdir=$TF_ROOT plan $OPTIONS --out plan
    - mkdir -p tmp && cp $TF_ROOT/plan tmp/plan
    - terraform -chdir=$TF_ROOT show -no-color -json plan > tmp/plan.json


.terraform:apply:
  stage: apply
  extends: .terraform-builder
  when: manual
  script:
    - echo "Running terraform apply (workdir=$TF_ROOT, option=$OPTIONS)"
    - |
      if [ -e "tmp/plan" ]; then
        echo "plan file exists, copying to $TF_ROOT"
        cp tmp/plan $TF_ROOT/plan
      fi
    - terraform -chdir=$TF_ROOT apply $OPTIONS

