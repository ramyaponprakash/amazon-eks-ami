.run-temp-bastion:
  script:
    - |
      echo "Provision temporal bastion"
      TEMP_ID=Temp-bastion-$CI_COMMIT_REF_SLUG-$(uuidgen)
      # aws ec2 create-key-pair --key-name $TEMP_ID --query 'KeyMaterial' --output text > TEMP_ID.pem
      export TEMP_EC2_ID=$(aws ec2 run-instances \
        --image-id ami-059b01eb1dee1e15c \
        --instance-type t2.micro \
        --security-group-ids $SECURITY_GROUP_ID \
        --subnet-id $SUBNET_ID \
        --key-name adex-prd \
        --iam-instance-profile Arn=$EC2_IAM_ROLE_ARN \
        --metadata-options '{"HttpTokens":"required","HttpPutResponseHopLimit":2,"HttpEndpoint":"enabled"}' \
          --user-data "#!/bin/bash
          yum install -y amazon-ssm-agent ec2-instance-connect
          systemctl enable amazon-ssm-agent && systemctl start amazon-ssm-agent" \
        --output text \
        --query 'Instances[0].InstanceId')
      echo "EC2 instance created with ID: $TEMP_EC2_ID"
      echo "Waiting for the instance to be in a running state..."
      aws ec2 wait instance-status-ok --instance-ids $TEMP_EC2_ID
      aws ec2 create-tags --resources $TEMP_EC2_ID --tags Key=Name,Value=T$TEMP_ID Key=Owner,Value=gitlab-ci