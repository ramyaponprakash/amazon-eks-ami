---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sense-nats-config
  namespace: sense-bb
  labels:
    app.kubernetes.io/name: sense-nats
    app.kubernetes.io/instance: sense-nats
data:
  nats.conf: |
    pid_file: "/var/run/nats/nats.pid"
    http: 8222

    cluster {
      port: 6222
      routes [
        nats://nats-0.nats.default.svc:6222
        nats://nats-1.nats.default.svc:6222
        nats://nats-2.nats.default.svc:6222
      ]

      cluster_advertise: $CLUSTER_ADVERTISE
      connect_retries: 30
    }

    leafnodes {
      port: 7422
    }
---
apiVersion: v1
kind: Service
metadata:
  name: sense-nats
  namespace: sense-bb
  labels:
    app.kubernetes.io/name: sense-nats
    app.kubernetes.io/instance: sense-nats
spec:
  type: ClusterIP
  ports:
    - name: service
      protocol: TCP
      port: 4222
      targetPort: 4222
    - name: http
      protocol: TCP
      port: 8222
      targetPort: 8222
    - name: cluster
      protocol: TCP
      port: 6222
      targetPort: 6222
    - name: metrics
      protocol: TCP
      port: 7777
      targetPort: 7777
    - name: leafnodes
      protocol: TCP
      port: 7422
      targetPort: 7422
    - name: gateways
      protocol: TCP
      port: 7522
      targetPort: 7522
  selector:
    app.kubernetes.io/name: sense-nats
    app.kubernetes.io/instance: sense-nats
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: sense-nats
  namespace: sense-bb
  labels:
    app.kubernetes.io/name: sense-nats
    app.kubernetes.io/instance: sense-nats
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: sense-nats
      app.kubernetes.io/instance: sense-nats
  replicas: 3
  serviceName: "sense-nats"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sense-nats
        app.kubernetes.io/instance: sense-nats
    spec:
      # Common volumes for the containers
      volumes:
      - name: config-volume
        configMap:
          name: sense-nats-config
      - name: pid
        emptyDir: {}

      # Required to be able to HUP signal and apply config reload
      # to the server without restarting the pod.
      shareProcessNamespace: true

      #################
      #               #
      #  NATS Server  #
      #               #
      #################
      terminationGracePeriodSeconds: 60
      containers:
      - name: nats
        image: vyalagadde/nats-testing:latest
        # image: nats:2.1.7-alpine3.11
        ports:
        - containerPort: 4222
          name: service
          hostPort: 4222
        - containerPort: 7422
          name: leafnodes
          hostPort: 7422
        - containerPort: 6222
          name: cluster
        - containerPort: 8222
          name: http
        - containerPort: 7777
          name: metrics
        command:
         - "nats-server"
         - "--config"
         - "/etc/nats-config/nats.conf"

        # Required to be able to define an environment variable
        # that refers to other environment variables.  This env var
        # is later used as part of the configuration file.
        env:
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: CLUSTER_ADVERTISE
          value: $(POD_NAME).nats.$(POD_NAMESPACE).svc
        volumeMounts:
          - name: config-volume
            mountPath: /etc/nats-config
          - name: pid
            mountPath: /var/run/nats

        # Liveness/Readiness probes against the monitoring
        #
        livenessProbe:
          httpGet:
            path: /
            port: 8222
          initialDelaySeconds: 10
          timeoutSeconds: 5
        readinessProbe:
          httpGet:
            path: /
            port: 8222
          initialDelaySeconds: 10
          timeoutSeconds: 5

        # Gracefully stop NATS Server on pod deletion or image upgrade.
        #
        lifecycle:
          preStop:
            exec:
              # Using the alpine based NATS image, we add an extra sleep that is
              # the same amount as the terminationGracePeriodSeconds to allow
              # the NATS Server to gracefully terminate the client connections.
              #
              command: ["/bin/sh", "-c", "nats-server -sl=ldm=/var/run/nats/nats.pid && /bin/sleep 60"]
---