{{- if .Values.ingress.enabled -}}
{{- $fullName := include "sense.fullname" . -}}
{{- $svcPort := .Values.service.port -}}
apiVersion: networking.k8s.io/v1beta1
kind: Ingress
metadata:
  name: {{ $fullName }}-backend
  namespace:  {{ include "sense.fullname" . }}
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/rewrite-target: "/$1"
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/backend-protocol: HTTPS
    nginx.ingress.kubernetes.io/secure-backends: "true"
    nginx.ingress.kubernetes.io/proxy-ssl-secret: "sense/proxy-ca-secret"
spec:
  rules:
  - http:
      paths:
      - path: /api/(auth/?(.*)$)
        backend:
          serviceName: auth
          servicePort: 8080
      - path: /api/(iam/?(.*)$)
        backend:
          serviceName: iam
          servicePort: 8081
      - path: /api/(topics/?(.*)$)
        backend:
          serviceName: topics
          servicePort: 8082
      - path: /api/(policies/?(.*)$)
        backend:
          serviceName: policy
          servicePort: 8083
      - path: /api/(role/?(.*)$)
        backend:
          serviceName: role
          servicePort: 8084
      - path: /api/(clients/?(.*)$)
        backend:
          serviceName: client
          servicePort: 8085        
      - path: /api/(activities/?(.*)$)
        backend:
          serviceName: activity
          servicePort: 8087
      - path: /api/(subscriptions/?(.*)$)
        backend:
          serviceName: subscription
          servicePort: 8088
      - path: /api/(onpremtopics/?(.*)$)
        backend:
          serviceName: onpremtopic
          servicePort: 8089          
      - path: /api/(lookup/?(.*)$)
        backend:
          serviceName: lookup
          servicePort: 8999
      - path: /api/(messages/?(.*)$)
        backend:
          serviceName: message
          servicePort: 8100
      - path: /api/(notification/?(.*)$)
        backend:
          serviceName: notification
          servicePort: 8101
      - path: /api/(adaptors/?(.*)$)
        backend:
          serviceName: adaptor
          servicePort: 8180
      - path: /api/(appsettings/?(.*)$)
        backend:
          serviceName: appsettings
          servicePort: 8182              
{{- end }}