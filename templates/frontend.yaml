  replicas: {{ .Values.replicaCount }}
{{- end }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "sense.fullname" . }}-frontend-auth
      app.kubernetes.io/instance: {{ include "sense.fullname" . }}-frontend-auth
  template:
    metadata:
    {{- with .Values.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
    {{- end }}
      labels:
        app.kubernetes.io/name: {{ include "sense.fullname" . }}-frontend-auth
        app.kubernetes.io/instance: {{ include "sense.fullname" . }}-frontend-auth
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
